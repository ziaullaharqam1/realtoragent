name: proppilot

# Local dependencies + optional Next.js container.
# Production: deploy apps/ai-agent to Vercel. Do not use AWS.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: proppilot
      POSTGRES_USER: proppilot
      POSTGRES_PASSWORD: proppilot
    ports:
      - "15432:5432"
    volumes:
      - pp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proppilot -d proppilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.2-alpine
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - pp_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-02-21T16-00-46Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/proppilot || true &&
      exit 0
      "

  ai-agent:
    build:
      context: ../apps/ai-agent
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      PORT: 13447
      DATABASE_URL: postgresql://proppilot:proppilot@postgres:5432/proppilot
      REDIS_URL: redis://redis:6379
      REDIS_PROVIDER: ioredis
      OBJECT_STORAGE_PROVIDER: minio
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_ACCESS_KEY: minioadmin
      OBJECT_STORAGE_SECRET_KEY: minioadmin
      OBJECT_STORAGE_BUCKET: proppilot
      GATEWAY_MODE: local
      LLM_ENABLED: "false"
      TENANT_DEFAULT: default
    ports:
      - "13447:13447"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:13447/api/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  pp_pgdata:
  pp_minio:
